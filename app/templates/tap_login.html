{% extends "base.html" %}

{% block title %}Tap to Login - Office Drink Tally{% endblock %}

{% block content %}
<div class="tap-page">
    <div class="card tap-card">
        <h2>Select User & Enter PIN 🔐</h2>
        
        <form method="POST" action="{{ url_for('tap') }}" class="tap-form">
            <div class="form-group">
                <label for="user_id">Select Your Name:</label>
                <select name="user_id" id="user_id" required class="form-control">
                    <option value="">-- Choose --</option>
                    {% for user in users %}
                        <option value="{{ user['id'] }}">{{ user['name'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="pin">Enter PIN:</label>
                <input type="password" 
                       name="pin" 
                       id="pin" 
                       required 
                       class="form-control"
                       pattern="[0-9]*"
                       inputmode="numeric"
                       maxlength="6"
                       placeholder="Enter your PIN">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="remember_me" checked>
                    Remember me on this device
                </label>
            </div>

            <button type="submit" class="btn btn-large btn-primary">
                Add Drink 🥤
            </button>
        </form>

        <div class="tap-info">
            <p class="text-small">
                First time? Contact admin to set up your account.
            </p>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    // Auto-focus on PIN when user is selected
    document.getElementById('user_id').addEventListener('change', function() {
        if (this.value) {
            document.getElementById('pin').focus();
        }
    });
</script>
{% endblock %}
